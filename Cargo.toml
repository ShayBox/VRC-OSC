[workspace]
resolver = "2"
members = [
    "loader",
    "plugin-chatbox",
    "plugin-clock",
    "plugin-control",
    "plugin-debug",
    "plugin-lastfm",
    "plugin-spotify",
    #"plugin-steamvr",
]

[workspace.package]
version = "2.7.0"
authors = ["Shayne Hartford <shaybox@shaybox.com>"]
edition = "2024"

[patch.crates-io]
pookie = { git = "https://github.com/AldaronLau/pookie.git" }

[workspace.dependencies]
anyhow = "1"
async-ffi = "0.5"
derive-config = { version = "2", default-features = false }
dotenvy_macro = "0.15"
enigo = "0.6"
ferrispot = { version = "0.4", default-features = false }
human-panic = "2"
inquire = "0.9"
libloading = "0.9"
ovr_overlay = { git = "https://github.com/Shays-Forks/ovr_overlay.git" }
path-absolutize = "3"
rosc = "0.11"
serde = "1"
serde-this-or-that = "0.5"
serde_json = "1"
spotify-lyrics = "0.0.9"
structstruck = "0.5"
terminal-link = "0.1"
tiny_http = "0.12"
tokio = "1"
toml = "1"
ureq = "3"
url = "2"
vrc-osc = { path = "loader" }
walkdir = "2"
webbrowser = "1"
windows = "0.62"
winres = "0.1"

# https://github.com/johnthagen/min-sized-rust
[profile.release]
strip = true      # Automatically strip symbols from the binary.
opt-level = "z"   # Optimize for size.
lto = true
codegen-units = 1
